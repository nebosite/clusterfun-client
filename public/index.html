<!doctype html>
<html>
  <head>
    <title>ClusterFun</title>
    <link rel="icon" href="/favicon.ico" />
    <!-- Without a viewport tag phones lay the page out at ~980px and scale it
         down, which is why focusing an input zoomed the screen and a stray
         double-tap zoomed the layout.  maximum-scale=1 stops both. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
